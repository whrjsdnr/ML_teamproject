[project]
name = "dns-security-ai"
version = "0.1.0"
description = "Standalone reviewed DNS INT8 classification and immutable evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.3", "pydantic>=2.13.5"]

[project.optional-dependencies]
litert = ["ai-edge-litert==2.3.0", "joblib>=1.6.0", "scikit-learn>=1.9.1", "pandas>=3.0.6"]
tensorflow = ["tensorflow==2.21.0", "joblib>=1.6.0", "scikit-learn>=1.9.1", "pandas>=3.0.6"]

[project.scripts]
dns-security-ai = "dns_security_ai.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
