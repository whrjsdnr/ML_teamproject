[project]
name = "network-security-ai"
version = "0.1.0"
description = "Standalone CSE-CIC-IDS2018 network inference and evidence module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.3", "pydantic>=2.13.5"]

[project.optional-dependencies]
detection-quality = ["lightgbm>=4.7.0"]
edge = ["torch>=2.14.1", "joblib>=1.6.0", "scikit-learn>=1.9.1"]

[project.scripts]
network-security-ai = "network_security_ai.__main__:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["network_security_ai"]
