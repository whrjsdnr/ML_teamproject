[project]
name = "ml"
version = "0.1.0"
description = "CSE-CIC-IDS2018 network experiments and standalone Network Security AI"
readme = "README.md"
authors = [
    { name = "whrjsdnr", email = "geonugjo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "lightgbm>=4.7.0",
    "joblib>=1.6.0",
    "network-security-ai>=0.1.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "torchao>=0.18.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
network-security-ai = { path = "packages/network-security-ai", editable = true }
